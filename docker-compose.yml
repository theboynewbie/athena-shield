services:
  athena-shield:
    build: .
    container_name: athena-shield
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Restrict dashboard port (e.g. "127.0.0.1:1081:1081") or enable DASHBOARD_TLS_CERT / DASHBOARD_TLS_KEY in production
      - "1081:1081"
    volumes:
      - athena_data:/data
      - /sys:/host/sys:ro
    environment:
      TZ: Asia/Jakarta
      ACME_EMAIL: admin@example.com
      SECRET_KEY: ""
      TRUSTED_PROXIES: ""
      EDGE_CACHE_MAX_MB: "128"
      UPSTREAM_INSECURE_TLS: "false"

volumes:
  athena_data:
