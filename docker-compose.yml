services:
  athena-shield:
    build: .
    container_name: athena-shield
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "1081:1081"
    volumes:
      - athena_data:/data
      - /sys:/host/sys:ro
    environment:
      TZ: Asia/Jakarta
      ACME_EMAIL: admin@example.com
      SECRET_KEY: ""

volumes:
  athena_data:
